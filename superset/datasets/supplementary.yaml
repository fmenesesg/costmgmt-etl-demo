# Class A warehouse SQL: priced supplementary layer. Do not mix with other measures.
name: supplementary_by_project
sql: |
  SELECT
      usage_date,
      source_type,
      cluster_id,
      project,
      currency,
      SUM(supplementary_total) AS supplementary_total
  FROM costmgmt.fact_ocp_cost_by_project
  WHERE currency = 'BRL'
  GROUP BY usage_date, source_type, cluster_id, project, currency
