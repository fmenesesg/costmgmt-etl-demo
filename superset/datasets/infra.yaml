# Class A warehouse SQL: infra is its own series. infra_total 0.0 is valid.
name: infra_by_project
sql: |
  SELECT
      usage_date,
      source_type,
      cluster_id,
      project,
      currency,
      SUM(infra_total) AS infra_total
  FROM costmgmt.fact_ocp_cost_by_project
  WHERE currency = 'BRL'
  GROUP BY usage_date, source_type, cluster_id, project, currency
